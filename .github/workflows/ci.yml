name: CI

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  firmware-unix:
    name: Firmware tests (MicroPython unix port)
    runs-on: ubuntu-latest
    steps:
      - name: Check out DemonCore
        uses: actions/checkout@v4
      - name: Install unix-port build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev
      - name: Build pinned MicroPython unix port
        run: |
          git clone --depth 1 --branch v1.29.0 https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython"
          make -C "$RUNNER_TEMP/micropython/ports/unix" submodules
          make -C "$RUNNER_TEMP/micropython/ports/unix" -j2
      - name: Run firmware core tests on MicroPython
        run: |
          MICROPYPATH=.frozen:firmware "$RUNNER_TEMP/micropython/ports/unix/build-standard/micropython" firmware/tests/test_core.py

  firmware-esp32:
    name: Build DemonCore ESP32 merged firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Check out DemonCore
        uses: actions/checkout@v4
      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
      - name: Fetch pinned MicroPython source
        run: |
          git clone --depth 1 --branch v1.29.0 https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython"
          test "$(git -C "$RUNNER_TEMP/micropython" rev-parse HEAD)" = "0fd6c573ea815774668bbb16b8e197c8822368b2"
      - name: Fetch and install pinned ESP-IDF
        run: |
          git clone --depth 1 --branch v5.5.2 --recursive --shallow-submodules https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          test "$(git -C "$RUNNER_TEMP/esp-idf" rev-parse HEAD)" = "30aaf64524299d3bde422ca9a2848090d1bc5d0f"
          cd "$RUNNER_TEMP/esp-idf"
          ./install.sh esp32
      - name: Exercise provisioning with the pinned ESP-IDF NVS generator
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python -m pip install "qrcode>=8.2,<9"
          TMP_PROVISION="$(mktemp -d)"
          trap 'rm -rf "$TMP_PROVISION"' EXIT
          printf 'node_id,name,cell\n7001,CI fixture,ci-lab\n' > "$TMP_PROVISION/nodes.csv"
          python -c "from pathlib import Path; Path('$TMP_PROVISION/domain.key').write_bytes(bytes(range(32)))"
          python tools/provision.py \
            --nodes "$TMP_PROVISION/nodes.csv" \
            --domain-key-file "$TMP_PROVISION/domain.key" \
            --output-dir "$TMP_PROVISION/out" \
            --nvs-generator "$RUNNER_TEMP/esp-idf/components/nvs_flash/nvs_partition_generator/nvs_partition_gen.py"
          test "$(stat -c %s "$TMP_PROVISION/out/node-7001.nvs.bin")" = "16384"
          test -s "$TMP_PROVISION/out/node-7001-label.svg"
          python -c "import json,pathlib; d=json.loads(pathlib.Path('$TMP_PROVISION/out/registry-export.json').read_text()); assert d['nodes'][0]['node_id']==7001; assert 'device_secret' not in d['nodes'][0]"
      - name: Build merged firmware and memory report
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          export MPYTHON_DIR="$RUNNER_TEMP/micropython"
          export IDF_PATH="$RUNNER_TEMP/esp-idf"
          firmware/build/build.sh
      - name: Upload merged firmware and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demoncore-ESP32-Master-Firmware
          path: |
            firmware/build/Demoncore ESP32 Master Firmware.bin
            firmware/build/report.md
            firmware/build/firmware.sha256
            firmware/build/partitions.csv
          if-no-files-found: warn
          retention-days: 30

  host-tools:
    name: Host tools and provisioning tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out DemonCore
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host-tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test host tools
        run: python -m unittest discover -s tools/tests -v
